<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI App Server · Your application</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#203251;background:#f6f8fe;line-height:1.5}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{height:68px;background:#ffffffea;border-bottom:1px solid #e6ebf5;display:flex;align-items:center;gap:13px;padding:0 30px;position:sticky;top:0;z-index:5;backdrop-filter:blur(9px)}.brand{display:grid;place-items:center;width:40px;height:40px;background:#2465db;color:white;border-radius:12px;font-size:21px;font-weight:850;box-shadow:0 6px 17px #1763b936}.brandtext strong{font-size:15px;display:block;letter-spacing:-.02em}.brandtext small{font-size:10px;font-weight:800;letter-spacing:.1em;color:#8292a9}.topright{margin-left:auto;display:flex;gap:12px;align-items:center}.status{padding:6px 10px;background:#e8f9f0;border:1px solid #c8f0dc;color:#12734a;border-radius:99px;font-size:11px;font-weight:800}.status:before{content:'';display:inline-block;background:#19aa6b;width:7px;height:7px;border-radius:50%;margin-right:7px}.admin{color:#4f6284;text-decoration:none;font-size:12px;font-weight:700;padding:9px 12px;border:1px solid #e4eaf5;border-radius:10px}.admin:hover{background:#eff4ff}.shell{display:grid;grid-template-columns:minmax(245px,293px) minmax(0,1fr);min-height:calc(100vh - 68px)}aside{background:#fff;border-right:1px solid #e5eaf3;padding:26px 21px 36px;display:flex;flex-direction:column;gap:0}.side-title{font-size:10px;letter-spacing:.15em;color:#95a2b7;font-weight:850;margin:5px 11px 19px}.side-intro{margin:0 11px 22px;font-size:12px;color:#8191aa;line-height:1.65}.side-content{flex:1}.side-content article{margin-bottom:17px}.sidebar-note{border:1px dashed #c7d8f4;background:#f7faff;border-radius:14px;padding:16px;margin-top:22px}.sidebar-note strong{font-size:12px}.sidebar-note p{font-size:11px;color:#7187a7;margin-bottom:0}.content{padding:36px clamp(22px,5vw,72px) 72px;max-width:1420px;width:100%;margin:0 auto}.content .eyebrow{color:#396dc7;font-size:11px;font-weight:850;letter-spacing:.14em;margin-bottom:8px}h1{font-size:clamp(26px,3vw,37px);letter-spacing:-.045em;line-height:1.16;margin:8px 0 12px;color:#152b54}h2{font-size:19px;margin:0;color:#1b3155;letter-spacing:-.03em}p{margin:8px 0;font-size:13px;line-height:1.7;color:#5c6e8c}article{margin:15px 0}.content article:has(h1){margin-top:0}.content article:has(h1)+article p{font-size:14px;max-width:850px}.section{font-size:16px;font-weight:850;letter-spacing:-.025em;margin:10px 0 13px}.side-content .section{font-size:13px}.caption{font-size:10px;letter-spacing:.045em;font-weight:750;color:#8b9bb2;margin:4px 0}.guide{border:1px solid #dce7fa;background:#f7faff;border-radius:12px;padding:13px 16px;font-size:12px;color:#42618c;line-height:1.65}.card{border-radius:17px;border:1px solid #e5ebf7;background:#fff;padding:20px;box-shadow:0 8px 27px #28457006}.field{display:grid;gap:8px}.field label{font-size:12px;font-weight:750;color:#4e6383}input:not([type=checkbox]),select,textarea{width:100%;padding:11px 12px;border:1px solid #d9e3f1;border-radius:10px;background:#fff;color:#263b5d;outline:none;font-size:13px}textarea{resize:vertical;min-height:100px;line-height:1.55}input:focus,textarea:focus,select:focus{border-color:#81a5f6;box-shadow:0 0 0 3px #276bed1a}input[type=checkbox]{accent-color:#326ce7}.checkbox-label{display:flex;align-items:center;gap:9px;color:#4f6687;font-size:12px}.btn{border:0;background:#2367e7;color:#fff;font-weight:800;padding:12px 18px;border-radius:10px;box-shadow:0 6px 12px #1b5aca18;font-size:12px}.btn:hover{background:#1653c3}.metric{background:#fff;border:1px solid #e5ebf7;border-radius:14px;padding:18px 22px;display:inline-grid;gap:5px;min-width:195px;box-shadow:0 6px 24px #28457008}.metric strong{font-size:20px;color:#214b9b}.metric span{font-size:11px;color:#8797ab;font-weight:700}.notice{background:#edfbf4;color:#186848;border:1px solid #bfead1;padding:13px 16px;border-radius:12px;font-size:12px;line-height:1.6}.notice.warning{background:#fff8e9;color:#865e20;border-color:#f4dfa9}.notice.error{background:#fff0f2;color:#9f3b52;border-color:#f3d3db}.notice.work{background:#eaf2ff;color:#245bba;border-color:#bcd3ff;margin:10px 0;display:flex;align-items:center;gap:9px}.btn:disabled{opacity:.7;cursor:progress}.output{background:#fff;border:1px solid #dce6f7;border-left:4px solid #3477ed;border-radius:14px;box-shadow:0 8px 24px #29518a0a;padding:22px;color:#243b59;font-size:14px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;max-width:940px}table{border-collapse:collapse;width:100%;background:#fff;border:1px solid #e1e8f4;border-radius:12px;overflow:hidden;font-size:12px}th,td{padding:11px 13px;border-bottom:1px solid #e9eef6;text-align:left}th{background:#f0f5fc;color:#546c91}td{color:#526683}pre{padding:17px 20px;overflow-x:auto;background:#152b4e;color:#e7effc;border-radius:13px;font-size:12px;line-height:1.65}hr{border:0;border-top:1px solid #e4eaf4;margin:24px 0}.cols{display:grid;gap:15px;grid-template-columns:repeat(var(--cols),minmax(0,1fr))}.columnslot>article:first-child{margin-top:0}.empty{border:1px dashed #b7cbee;border-radius:12px;padding:24px;color:#6881a6}.footer{font-size:11px;color:#92a0b5;margin:34px 0 0}.sidebar-collapsed .shell,.sidebar-empty .shell{grid-template-columns:1fr}.sidebar-collapsed aside,.sidebar-empty aside{display:none}.toggle{background:none;color:#4a6485;border:1px solid #e2e9f3;border-radius:10px;width:36px;height:36px;font-size:18px;display:grid;place-items:center}.loading{display:flex;gap:12px;color:#6c84a9;align-items:center;padding:35px;border:1px dashed #ccdcf7;border-radius:14px}.spinner{width:16px;height:16px;border:2px solid #d6e5fa;border-top-color:#386fe2;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:780px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #e5eaf3}.content{padding:24px 19px}.top{padding:0 15px}.brandtext small,.status{display:none}.cols{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><button class="toggle" id="toggle" title="Show or hide developer sidebar" aria-label="Toggle sidebar">☰</button><span class="brand">AI</span><div class="brandtext"><strong>AI App Server</strong><small>SELF-HOSTED PYTHON FRAMEWORK</small></div><div class="topright"><span class="status">Local application</span><a class="admin" href="/admin">Server admin ↗</a></div></header>
<div class="shell"><aside id="sidepanel"><div class="side-title">MODEL &amp; APP CONTROLS</div><div class="side-content" id="sidebar"></div></aside><main class="content"><div class="eyebrow">APPLICATION WORKSPACE</div><div id="app"><div class="loading"><span class="spinner"></span>Connecting to your Python application…</div></div><div class="footer">Powered by your self-hosted AI App Server · No cloud account required</div></main></div>
<script>
'use strict';
const app=document.getElementById('app'),sidebar=document.getElementById('sidebar');
const values={};let ws;const pending=new Map();let working=false;
function stage(id,value){values[id]=value}
function commit(id,value){stage(id,value);clearTimeout(pending.get(id));pending.set(id,setTimeout(()=>{pending.delete(id);if(ws.readyState===1)ws.send(JSON.stringify({values}))},260))}
const el=(tag,cls='',value)=>{let n=document.createElement(tag);if(cls)n.className=cls;if(value!==undefined)n.textContent=String(value);return n};
function emit(id,value,once=false){
  if(once&&working)return;
  for(const timer of pending.values())clearTimeout(timer);
  pending.clear();values[id]=value;
  if(ws&&ws.readyState===WebSocket.OPEN){
    ws.send(JSON.stringify({values}));
    if(once){
      working=true;
      const button=[...document.querySelectorAll('button[data-widget-id]')].find(b=>b.dataset.widgetId===id);
      if(button){
        button.disabled=true;
        button.setAttribute('aria-busy','true');
        button.textContent=/generat/i.test(button.textContent)?'Generating response…':'Running…';
        button.closest('article')?.append(el('div','notice work','Working on your request. Local AI models may take a little while to answer.'));
      }
    }
  }else{
    app.prepend(el('div','notice error','The application is disconnected. Restart your server and refresh the page.'));
  }
  if(once)delete values[id];
}
function display(c,root){let box=el('article'),node;
switch(c.type){
case 'title':node=el('h1','',c.value);break;
case 'output':node=el('div','output',c.value);break;
case 'heading':node=el('h2','',c.value);break;
case 'section':node=el('div','section',c.value);break;
case 'caption':node=el('div','caption',c.value);break;
case 'guide':node=el('div','guide',c.value);break;
case 'text':case 'markdown':node=el('p','',c.value);break;
case 'code':node=el('pre','',c.value);break;
case 'divider':node=document.createElement('hr');break;
case 'notice':node=el('div','notice '+c.tone,c.value);break;
case 'metric':node=el('div','metric');node.append(el('span','',c.label),el('strong','',c.value));break;
case 'button':node=el('button','btn',c.label);node.dataset.widgetId=c.id;node.onclick=()=>emit(c.id,true,true);break;
case 'input':case 'number':{node=el('div','field');let label=el('label','',c.label),i=document.createElement('input');i.type=c.type==='number'?'number':'text';i.value=c.value;i.oninput=()=>stage(c.id,c.type==='number'?Number(i.value):i.value);i.onchange=()=>commit(c.id,c.type==='number'?Number(i.value):i.value);node.append(label,i);break;}
case 'textarea':{node=el('div','field');let label=el('label','',c.label),area=document.createElement('textarea');area.value=c.value;area.style.height=c.height+'px';area.oninput=()=>stage(c.id,area.value);area.onchange=()=>commit(c.id,area.value);node.append(label,area);break;}
case 'checkbox':{node=el('label','checkbox-label');let i=document.createElement('input');i.type='checkbox';i.checked=c.value;i.onchange=()=>emit(c.id,i.checked);node.append(i,document.createTextNode(c.label));break;}
case 'select':{node=el('div','field');node.append(el('label','',c.label));let s=document.createElement('select');for(const o of c.options){const opt=el('option','',o);opt.value=JSON.stringify(o);if(o===c.value)opt.selected=true;s.append(opt)}s.onchange=()=>emit(c.id,JSON.parse(s.value));node.append(s);break;}
case 'table':{node=document.createElement('table');let rows=c.rows||[];if(rows.length){let keys=[...new Set(rows.flatMap(r=>r&&typeof r==='object'?Object.keys(r):['value']))],head=document.createElement('thead'),tr=document.createElement('tr');keys.forEach(k=>tr.append(el('th','',k)));head.append(tr);node.append(head);let body=document.createElement('tbody');rows.forEach(r=>{let tr=document.createElement('tr');keys.forEach(k=>{let v=r&&typeof r==='object'?r[k]:r;tr.append(el('td','',typeof v==='object'?JSON.stringify(v):v??''))});body.append(tr)});node.append(body)}break;}
default:node=el('pre','',JSON.stringify(c));
}
box.append(node);root.append(box);
}
function draw(components){working=false;app.replaceChildren();sidebar.replaceChildren();const grids={};for(const c of components){let root=c.container==='sidebar'?sidebar:app;const match=c.container?.match(/^column-(\d+)-of-(\d+)$/);if(match){const n=Number(match[2]),i=Number(match[1]);if(!grids[n]){const grid=el('div','cols');grid.style.setProperty('--cols',n);for(let j=0;j<n;j++)grid.append(el('div','columnslot'));app.append(grid);grids[n]=grid}root=grids[n].children[i]}display(c,root)}document.body.classList.toggle('sidebar-empty',!sidebar.childElementCount)}
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onmessage=e=>{const message=JSON.parse(e.data);if(message.error){working=false;app.replaceChildren(el('div','notice error',message.error));return}if(message.components)draw(message.components)};ws.onclose=()=>{working=false;app.append(el('div','notice warning','Connection closed. Restart your Python application and refresh the page.'))}}
document.getElementById('toggle').onclick=()=>document.body.classList.toggle('sidebar-collapsed');connect();
</script></body></html>
