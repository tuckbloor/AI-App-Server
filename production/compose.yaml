# Each project runs independently with its own data and admin account.
# Put this file inside this project's production/ folder and set production/.env.
services:
  ai-app:
    build:
      context: ..
      dockerfile: production/Dockerfile
    image: ai-app-server-local:1.0.2
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/health', timeout=4).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    environment:
      AI_APP_SERVER_BEHIND_TLS_PROXY: '1'
      AI_APP_SERVER_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in production/.env}
      AI_APP_SERVER_APP_PASSWORD: ${AI_APP_SERVER_APP_PASSWORD:?Set AI_APP_SERVER_APP_PASSWORD in production/.env}
      AI_APP_SERVER_MCP_TOOLS_APPROVED: ${AI_APP_SERVER_MCP_TOOLS_APPROVED:-0}
      AI_APP_SERVER_MCP_TOOLS_SHA256: ${AI_APP_SERVER_MCP_TOOLS_SHA256:-}
    volumes:
      - ../app:/workspace/app:ro
      - aiapp_data:/workspace/data
      - aiapp_config:/workspace/config
      - aiapp_backups:/workspace/backups
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
  # Daily verified application/database snapshots in a separate Docker volume.
  # Copy these snapshots OFF THE HOST for true disaster recovery.
  backup:
    image: ai-app-server-local:1.0.2
    command: ["python", "/workspace/production/backup_worker.py"]
    depends_on: [ai-app]
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      AI_APP_SERVER_BACKUP_INTERVAL: "86400"
      AI_APP_SERVER_BACKUP_RETENTION: "7"
    volumes:
      - ../app:/workspace/app:ro
      - aiapp_data:/workspace/data
      - aiapp_config:/workspace/config
      - aiapp_backups:/workspace/backups
  caddy:
    image: caddy:2.10.2
    # Caddy shares the same network namespace: Python listens on loopback only.
    network_mode: service:ai-app
    depends_on: [ai-app]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in production/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  aiapp_data:
  aiapp_config:
  caddy_data:
  caddy_config:
  aiapp_backups:
